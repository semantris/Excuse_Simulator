<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excuse Simulator — Official Department of Not My Fault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="noise-layer" aria-hidden="true"></div>

  <main class="ticket">

    <header class="ticket__head">
      <p class="stamp">DEPT. OF NOT MY FAULT · EST. NOW</p>
      <h1 class="wobble-title">Excuse Simulator</h1>
      <p class="subhead">professionally unaccountable since this morning</p>
    </header>

    <section class="daily" aria-label="Excuse of the day">
      <span class="daily__label">today's complimentary excuse</span>
      <p id="dailyExcuse" class="daily__text">loading a good one...</p>
    </section>

    <section class="situations" aria-label="Pick your emergency">
      <p class="section-label">what are we blaming today?</p>
      <div class="chip-row">
        <button type="button" class="chip chip--a selected" data-situation="college" onclick="selectSituation('college', event)">college</button>
        <button type="button" class="chip chip--b" data-situation="friends" onclick="selectSituation('friends', event)">friends</button>
        <button type="button" class="chip chip--c" data-situation="assignment" onclick="selectSituation('assignment', event)">assignment</button>
        <button type="button" class="chip chip--d" data-situation="phone" onclick="selectSituation('phone', event)">phone</button>
        <button type="button" class="chip chip--e" data-situation="family" onclick="selectSituation('family', event)">family</button>
        <button type="button" class="chip chip--f" data-situation="work" onclick="selectSituation('work', event)">work</button>
      </div>
    </section>

    <section class="dial" aria-label="Believability">
      <label for="believability" class="section-label">believability dial</label>
      <input type="range" id="believability" min="0" max="100" value="50" />
      <span id="percentage" class="dial__reading">50%</span>
    </section>

    <section class="buttons" aria-label="Actions">
      <button type="button" class="btn btn--primary" onclick="generateExcuse()">Generate Excuse</button>
      <button type="button" class="btn btn--ghost" onclick="makeDramatic()">Make It Dramatic</button>
      <button type="button" class="btn btn--ghost" onclick="copyExcuse()">Copy It</button>
    </section>

    <section id="result" class="result" aria-live="polite">
      <p class="result__placeholder">your excuse will materialize here, dramatically or otherwise</p>
    </section>

    <footer class="luck">
      <span>lifetime luck accumulated:</span>
      <strong id="luckScore">0</strong>
      <span class="luck__unit">questionable points</span>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
